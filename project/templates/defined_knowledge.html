<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Defined Knowledge — AI Database Assistant</title>
  <meta name="description" content="Teach each table just what the schema cannot express: a definition, synonyms, and abbreviations.">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0b0d14;
      --surface:   #111520;
      --surface2:  #161b2a;
      --border:    #1e2538;
      --border-hi: #2e3a52;
      --text:      #e4e8f4;
      --muted:     #8892a8;
      --accent:    #5eead4;
      --accent-dim:#1b3e39;
      --warn:      #fbbf24;
      --warn-dim:  #3c3018;
      --font:      'Inter', sans-serif;
      --mono:      'JetBrains Mono', monospace;
      --radius:    12px;
      --radius-sm: 8px;
    }

    html, body { height: 100%; }
    body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 14px; line-height: 1.6; display: flex; }

    /* ── Sidebar ── */
    aside {
      position: fixed; top: 0; left: 0; bottom: 0; width: 228px;
      background: var(--surface); border-right: 1px solid var(--border);
      padding: 24px 16px; display: flex; flex-direction: column; gap: 2px; z-index: 100;
    }
    .brand {
      font-size: 15px; font-weight: 700; color: var(--accent); letter-spacing: -.3px;
      padding: 0 8px; margin-bottom: 20px; display: flex; align-items: center; gap: 8px;
    }
    .nav-section {
      font-size: 10px; font-weight: 600; color: var(--muted); letter-spacing: .1em;
      text-transform: uppercase; padding: 12px 8px 4px;
    }
    .nav-link {
      display: flex; align-items: center; gap: 9px; padding: 8px 10px;
      border-radius: var(--radius-sm); color: var(--muted); text-decoration: none;
      font-size: 13.5px; font-weight: 500; transition: background 120ms, color 120ms;
    }
    .nav-link:hover { background: var(--surface2); color: var(--text); }
    .nav-link.active { background: var(--accent-dim); color: var(--accent); }
    .nav-icon { font-size: 15px; flex-shrink: 0; }

    /* ── Main ── */
    main { margin-left: 228px; flex: 1; padding: 40px 48px; max-width: calc(100vw - 228px); }

    .page-header { margin-bottom: 28px; }
    .page-header h1 { font-size: 22px; font-weight: 700; letter-spacing: -.4px; }
    .page-header p { color: var(--muted); margin-top: 4px; font-size: 13.5px; }

    /* ── Search ── */
    .search-wrap { position: relative; margin-bottom: 28px; max-width: 440px; }
    .search-wrap svg {
      position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
      color: var(--muted); pointer-events: none;
    }
    #search {
      width: 100%; background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-sm); padding: 10px 12px 10px 38px;
      color: var(--text); font-family: var(--font); font-size: 14px;
      outline: none; transition: border-color 140ms;
    }
    #search:focus { border-color: var(--accent); }
    #search::placeholder { color: var(--muted); }

    /* ── Grid ── */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(268px, 1fr));
      gap: 14px;
    }

    /* ── Card ── */
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 18px 20px;
      text-decoration: none; color: inherit;
      display: flex; flex-direction: column; gap: 12px;
      transition: border-color 150ms, transform 150ms, box-shadow 150ms;
      cursor: pointer;
    }
    .card:hover {
      border-color: var(--border-hi);
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(0,0,0,.35);
    }
    .card-name {
      font-family: var(--mono); font-size: 14.5px; font-weight: 500;
      color: var(--text); letter-spacing: -.2px;
    }
    .badge {
      display: inline-flex; align-items: center; gap: 5px;
      border-radius: 20px; padding: 3px 10px;
      font-size: 11.5px; font-weight: 600; letter-spacing: .01em; width: fit-content;
    }
    .badge-defined { background: var(--accent-dim); color: var(--accent); }
    .badge-needs   { background: var(--warn-dim);   color: var(--warn);   }

    .card-stats { display: flex; flex-direction: column; gap: 5px; }
    .stat-row {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 12.5px; color: var(--muted);
    }
    .stat-row .stat-label { }
    .stat-row .stat-val { font-weight: 600; color: var(--text); }
    .stat-row .stat-val.has { color: var(--accent); }

    .card-footer {
      font-size: 12px; color: var(--muted); display: flex; align-items: center;
      gap: 4px; margin-top: 2px; transition: color 150ms;
    }
    .card:hover .card-footer { color: var(--accent); }

    .empty {
      grid-column: 1/-1; padding: 48px; text-align: center;
      color: var(--muted); font-size: 14px;
    }
    .empty span { display: block; font-size: 32px; margin-bottom: 10px; }

    /* ── Stat summary bar ── */
    .summary-bar {
      display: flex; gap: 20px; margin-bottom: 24px; flex-wrap: wrap;
    }
    .summary-pill {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-sm); padding: 8px 14px;
      font-size: 12.5px; color: var(--muted);
    }
    .summary-pill strong { color: var(--text); }
  </style>
</head>
<body>

{% include '_app_shell.html' %}

<main>
  <div class="page-header">
    <h1>Defined Knowledge</h1>
    <p>Teach each table only what the schema cannot express — a definition, synonyms, and abbreviations.</p>
  </div>

  <div class="search-wrap">
    <svg width="15" height="15" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="8.5" cy="8.5" r="5.5"/><path d="M15 15l-3.5-3.5"/>
    </svg>
    <input id="search" type="search" placeholder="Search tables…" autocomplete="off" oninput="load()">
  </div>

  <div class="summary-bar" id="summary"></div>

  <div class="grid" id="grid">
    <div class="empty"><span>⏳</span>Loading tables…</div>
  </div>
</main>

<script>
  async function load() {
    const q = document.getElementById('search').value || '';
    const res = await fetch('/api/knowledge?search=' + encodeURIComponent(q));
    const d = await res.json();
    const rows = d.tables || [];

    const defined = rows.filter(r => r.defined).length;
    document.getElementById('summary').innerHTML = `
      <div class="summary-pill">Total <strong>${rows.length}</strong></div>
      <div class="summary-pill">Defined <strong>${defined}</strong></div>
      <div class="summary-pill">Needs Definition <strong>${rows.length - defined}</strong></div>
    `;

    document.getElementById('grid').innerHTML = rows.length
      ? rows.map(x => `
          <a class="card" href="/defined-knowledge/${encodeURIComponent(x.table)}" id="card-${x.table}">
            <div class="card-name">${x.table}</div>
            <span class="badge ${x.defined ? 'badge-defined' : 'badge-needs'}">
              ${x.defined ? '✓ Defined' : '◌ Needs Definition'}
            </span>
            <div class="card-stats">
              <div class="stat-row">
                <span class="stat-label">Definition</span>
                <span class="stat-val ${x.definition ? 'has' : ''}">${x.definition ? 'Yes' : 'No'}</span>
              </div>
              <div class="stat-row">
                <span class="stat-label">Synonyms</span>
                <span class="stat-val ${x.synonym_count > 0 ? 'has' : ''}">${x.synonym_count}</span>
              </div>
              <div class="stat-row">
                <span class="stat-label">Abbreviations</span>
                <span class="stat-val ${x.abbreviation_count > 0 ? 'has' : ''}">${x.abbreviation_count}</span>
              </div>
            </div>
            <div class="card-footer">Edit →</div>
          </a>`).join('')
      : '<div class="empty"><span>🔍</span>No matching tables.</div>';
  }

  load();
</script>
</body>
</html>

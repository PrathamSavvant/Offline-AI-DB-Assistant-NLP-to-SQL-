<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pending Knowledge</title><style>:root{--bg:#0b0d14;--card:#111520;--line:#2e3a52;--text:#e4e8f4;--muted:#8892a8;--accent:#5eead4;--warn:#fbbf24}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Inter,Arial,sans-serif}.wrap{max-width:900px;margin:56px auto;padding:0 28px}.back{color:var(--accent);text-decoration:none}h1{font:500 27px monospace;margin:24px 0}.muted{color:var(--muted)}.section{margin:30px 0}.head{border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:14px;font-size:11px;font-weight:700;letter-spacing:.11em;color:var(--muted)}textarea,input{width:100%;background:var(--card);border:1px solid var(--line);border-radius:7px;color:var(--text);padding:11px;font:inherit}textarea{min-height:120px;resize:vertical}.card{margin:14px 0;padding:18px;border:1px solid var(--line);border-radius:10px;background:var(--card)}.term{font:600 16px monospace;color:var(--warn)}.row{display:flex;gap:9px;margin-top:12px}.btn{border:0;border-radius:6px;padding:9px 14px;cursor:pointer;font-weight:700}.accept{background:#1b3e39;color:var(--accent)}.reject{background:#3c3018;color:var(--warn)}.ghost{background:#182035;color:var(--text);border:1px solid var(--line)}.empty{color:var(--muted);padding:15px 0}</style></head><body>
{% include '_app_shell.html' %}
<main class="wrap"><a class="back" href="/pending-knowledge">← Pending Knowledge</a><h1 id="title"></h1><p class="muted">Pending knowledge is not used by retrieval, predicates, or the LLM until you accept it.</p><section class="section"><div class="head">TABLE CONTEXT</div><textarea id="context" placeholder="Tell the AI what this table means and what it is used for."></textarea><div class="row"><button class="btn ghost" onclick="saveContext()">Save for review</button><button class="btn accept" onclick="acceptContext()">Accept context</button></div></section><section class="section"><div class="head">PENDING ABBREVIATIONS</div><div id="list" class="empty">Loading…</div></section></main><script>const TABLE={{ table_name|tojson }};document.getElementById('title').textContent=TABLE+' — Pending Review';async function api(url,body){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}async function load(){const d=await (await fetch('/api/knowledge/'+encodeURIComponent(TABLE)+'/pending')).json();document.getElementById('context').value=d.pending_table_context||'';const items=d.pending_abbreviations||[];document.getElementById('list').innerHTML=items.length?items.map(x=>`<div class="card"><div class="term">${esc(x.detected_term)}</div><p class="muted">What does this abbreviation mean?</p><input id="m-${esc(x.id)}" value="${esc(x.suggested_meaning||'')}" placeholder="Meaning"><div class="row"><button class="btn accept" onclick="acceptTerm('${esc(x.id)}','${esc(x.detected_term)}')">Accept</button><button class="btn reject" onclick="rejectTerm('${esc(x.id)}')">Reject</button></div></div>`).join(''):'<div class="empty">No pending abbreviations for this table.</div>'}async function saveContext(){await api('/api/knowledge/pending/table-context',{table:TABLE,context:document.getElementById('context').value});load()}async function acceptContext(){const ctx=document.getElementById('context').value.trim();if(!ctx)return alert('Enter a definition before accepting.');await api('/api/knowledge/pending/approve',{type:'table_context',table:TABLE,context:ctx});load()}async function acceptTerm(id,abbreviation){const meaning=document.getElementById('m-'+id).value.trim();if(!meaning)return alert('Enter a meaning before accepting.');await api('/api/knowledge/pending/approve',{id,table:TABLE,abbreviation,meaning});load()}async function rejectTerm(id){await api('/api/knowledge/pending/reject',{type:'business_term',id});load()}function esc(v){const e=document.createElement('span');e.textContent=v??'';return e.innerHTML}load();</script></body></html>
